name: Apply RunPod prep bundle

on:
  push:
    branches:
      - infra/runpod-rnd-prep
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify prep bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .bootstrap/samevoice-prep.tar.xz)" -eq 292844
          echo "067c48205bad2adade503c3502140dab9956c601264a4a4a7138feebcf21cd7e  .bootstrap/samevoice-prep.tar.xz" | sha256sum -c -
          tar -tJf .bootstrap/samevoice-prep.tar.xz >/dev/null

      - name: Apply source and container prep
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .bootstrap/samevoice-prep.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-runpod-prep.yml

      - name: Commit prepared repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Complete source baseline and prepare RunPod R&D image'
          git push origin HEAD:infra/runpod-rnd-prep
