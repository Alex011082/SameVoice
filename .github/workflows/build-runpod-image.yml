name: Build RunPod R&D image

on:
  workflow_dispatch:
    inputs:
      push_to_ghcr:
        description: Push the built image to GHCR
        required: true
        type: boolean
        default: false
      install_gpu_engines:
        description: Bake Stage-1 predictor/MT GPU dependencies into the image (0 or 1)
        required: true
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      install_tts_engine:
        description: Bake Chatterbox GPU1 A/B dependencies into the image (0 or 1)
        required: true
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      tag:
        description: Image tag
        required: true
        default: rnd

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samevoice:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.push_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          build-args: |
            INSTALL_GPU_ENGINES=${{ inputs.install_gpu_engines }}
            INSTALL_TTS_ENGINE=${{ inputs.install_tts_engine }}
          push: ${{ inputs.push_to_ghcr }}
          tags: ${{ steps.image.outputs.name }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
