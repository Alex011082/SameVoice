name: Build RunPod R&D image

on:
  workflow_dispatch:
    inputs:
      push_to_ghcr:
        description: Push the built image to GHCR
        required: true
        type: boolean
        default: false
      install_gpu_engines:
        description: Bake Stage-1 predictor/MT GPU dependencies into the image (0 or 1)
        required: true
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      install_tts_engine:
        description: Bake Chatterbox GPU1 A/B dependencies into the image (0 or 1)
        required: true
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      tag:
        description: Image tag
        required: true
        default: rnd

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Освобождаем диск ДО сборки. Прогон 30.08.2026 упал на
      # `No space left on device` при распаковке torch: раннер ubuntu-24.04 даёт
      # около 14 ГБ свободного, а заготовка с обоими стеками (THINK + синтез)
      # в них не влезает. Предустановленные Android SDK, .NET, GHC и образы
      # Docker нам не нужны ни на одном шаге и освобождают порядка 25-30 ГБ.
      # Делаем вручную, а не сторонним экшеном: этот шаг работает с диском
      # раннера, и лишняя зависимость здесь не окупается.
      - name: Free runner disk
        shell: bash
        run: |
          echo "до очистки:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "после очистки:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samevoice:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.push_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          build-args: |
            INSTALL_GPU_ENGINES=${{ inputs.install_gpu_engines }}
            INSTALL_TTS_ENGINE=${{ inputs.install_tts_engine }}
          push: ${{ inputs.push_to_ghcr }}
          tags: ${{ steps.image.outputs.name }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
