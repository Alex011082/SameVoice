name: Build RunPod R&D image

on:
  workflow_dispatch:
    inputs:
      push_to_ghcr:
        description: Push the built image to GHCR
        required: true
        type: boolean
        default: false
      tag:
        description: Image tag
        required: true
        default: rnd

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samevoice:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.push_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: ${{ inputs.push_to_ghcr }}
          tags: ${{ steps.image.outputs.name }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
