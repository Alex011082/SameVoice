name: Engine image (RunPod)

# Образ боевого движка: базовый образ RunPod + зависимости + веса моделей.
# Собирается здесь, а не на боевом сервере: сборка съедает ~35 ГБ диска, а на
# сервере свободно 37 — одно неверное движение уронило бы продакшен.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег образа (v1, v2, …)
        required: true
        default: v1
  push:
    branches: [main]
    paths:
      - gpu/Dockerfile.engine
      - gpu/image/**
      - .github/workflows/engine-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # На раннере ~20 ГБ свободно; база одна распаковывается в ~25.
      - name: Освободить диск
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - name: Имя образа
        id: image
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="sha-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samevoice-engine" >> "$GITHUB_OUTPUT"

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub — потому что хосты RunPod тянут оттуда быстро, а из GHCR
      # ~8 МБ/с: замер 05.09 дал 631 с до готовности вместо 77–180 (4,5 ГБ
      # наших слоёв качались ~9 минут). Секреты DOCKERHUB_USERNAME и
      # DOCKERHUB_TOKEN задаёт владелец в настройках репозитория; нет их —
      # образ уходит только в GHCR, как раньше.
      - name: Docker Hub настроен?
        id: hub
        shell: bash
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/samevoice-engine" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub не настроен — образ уйдёт только в GHCR"
          fi

      - name: Вход в Docker Hub
        if: steps.hub.outputs.have == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Список тегов
        id: tags
        shell: bash
        run: |
          {
            echo "list<<EOF"
            echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
            echo "${{ steps.image.outputs.name }}:latest"
            if [ "${{ steps.hub.outputs.have }}" = "true" ]; then
              echo "${{ steps.hub.outputs.name }}:${{ steps.image.outputs.tag }}"
              echo "${{ steps.hub.outputs.name }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Собрать и отправить
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu/Dockerfile.engine
          build-args: IMAGE_TAG=${{ steps.image.outputs.tag }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false

      - name: Итог
        run: |
          echo "GHCR: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
          [ "${{ steps.hub.outputs.have }}" = "true" ] && echo "Docker Hub: ${{ steps.hub.outputs.name }}:${{ steps.image.outputs.tag }}" || echo "Docker Hub: не настроен"
