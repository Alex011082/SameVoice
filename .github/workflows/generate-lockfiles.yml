name: Generate SameVoice dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-lockfiles.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix web install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd agent
          "$HOME/.local/bin/uv" lock --python 3.13

      - name: Commit lockfiles and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/generate-lockfiles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json web/package-lock.json agent/uv.lock .github/workflows/generate-lockfiles.yml
          git commit -m 'Add dependency lockfiles for reproducible builds'
          git push origin main
