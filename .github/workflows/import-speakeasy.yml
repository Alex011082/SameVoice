name: Import SpeakEasy baseline

on:
  push:
    branches: [main]
    paths:
      - '.migration/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail

          cat .migration/repair.part* > /tmp/repair.b64
          test "$(wc -c < /tmp/repair.b64)" -eq 91752
          echo "0ea544ba871eb3d79799a8e5b66ee275b52731a835981e9dcecda8fee103542e  /tmp/repair.b64" | sha256sum -c -

          {
            cat .migration/core.part00
            cat .migration/core.part01
            cat .migration/core.part02
            cat .migration/core.part03
            cat .migration/core.part04
            cat .migration/core.part05
            cat .migration/core.part06
            head -c 12000 .migration/core.part07
            cat .migration/core.part08
            cat .migration/core.part09
            cat .migration/core.part10
            dd if=/tmp/repair.b64 bs=1 skip=0 count=12000 status=none
            cat .migration/core.part12
            dd if=/tmp/repair.b64 bs=1 skip=12000 count=12000 status=none
            cat .migration/core.part14
            cat .migration/core.part15
            dd if=/tmp/repair.b64 bs=1 skip=24000 status=none
          } > /tmp/speakeasy-core.b64

          test "$(wc -c < /tmp/speakeasy-core.b64)" -eq 259752
          base64 --decode /tmp/speakeasy-core.b64 > /tmp/speakeasy-core.tar.xz
          echo "41854d759b6fc43d188a68aa1a4f28ac71c2e738e14f8dc9cf75ea9fa1853efb  /tmp/speakeasy-core.tar.xz" | sha256sum -c -
          tar -tJf /tmp/speakeasy-core.tar.xz >/dev/null

      - name: Extract tracked source baseline
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/speakeasy-core.tar.xz -C .
          rm -rf .migration
          rm -f scripts/.keep web/.keep web/src/.keep backend/.keep panel/.keep agent/scripts/.keep

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to import.'
            exit 0
          fi
          git commit -m 'Import SpeakEasy source baseline'
          git push origin main
