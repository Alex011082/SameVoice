# Сверка Коробки на GitHub (владелец 25.11.2026, на 3 дня).
#
# Коробка проверяет первой. Когда на голову открытого PR встаёт «Коробка: зелено»,
# GitHub прогоняет те же проверки из .cibox/korobka.json на своей машине и ставит
# статус `github`. korobka-vlit вливает только при двух зелёных: если Коробка
# что-то пропустила, GitHub не пропустит.
#
# Файл одинаковый во всех репозиториях; правка — в каждом.
name: Сверка Коробки

on:
  status

permissions:
  contents: read
  statuses: write
  pull-requests: read

concurrency:
  group: korobka-sverka-${{ github.event.sha }}
  cancel-in-progress: false

jobs:
  sverka:
    if: github.event.context == 'korobka' && github.event.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Ключ GitHub — только шагам до и после проверок: код PR его не видит
    # (иначе PR мог бы сам поставить себе «Коробка: зелено»).
    env:
      SHA: ${{ github.event.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Нужна ли сверка
        id: nuzhna
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Только голова открытого PR: коммиты слияния в main Коробка красит по
          # совпавшему содержимому, их сверять незачем.
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state=="open" and .head.sha==env.SHA)][0].number // empty')
          if [ -z "$pr" ]; then echo "не голова открытого PR — сверка не нужна"; echo "da=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Зелёный статус Коробки приходит от двух входов; второй раз не гоняем.
          uzhe=$(gh api "repos/$REPO/commits/$SHA/statuses" --jq '[.[] | select(.context=="github")][0].state // empty')
          if [ -n "$uzhe" ]; then echo "сверка этой головы уже есть ($uzhe)"; echo "da=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "da=1" >> "$GITHUB_OUTPUT"; echo "pr=$pr" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=pending -f context=github \
            -f description="GitHub: проверяет" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - if: steps.nuzhna.outputs.da == '1'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}
          fetch-depth: 0
          persist-credentials: false

      - if: steps.nuzhna.outputs.da == '1'
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - if: steps.nuzhna.outputs.da == '1'
        run: echo "NODE22_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - if: steps.nuzhna.outputs.da == '1'
        uses: actions/setup-node@v4
        with: { node-version: '24' }
      - if: steps.nuzhna.outputs.da == '1'
        run: echo "NODE24_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - if: steps.nuzhna.outputs.da == '1'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: steps.nuzhna.outputs.da == '1'
        run: echo "PY312_BIN=$(dirname "$(command -v python3)")" >> "$GITHUB_ENV"
      - if: steps.nuzhna.outputs.da == '1'
        uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - if: steps.nuzhna.outputs.da == '1'
        run: echo "PY313_BIN=$(dirname "$(command -v python3)")" >> "$GITHUB_ENV"
      - if: steps.nuzhna.outputs.da == '1'
        uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - if: steps.nuzhna.outputs.da == '1'
        run: echo "BUN_BIN=$(dirname "$(command -v bun)")" >> "$GITHUB_ENV"

      - if: steps.nuzhna.outputs.da == '1'
        name: Проверки из .cibox/korobka.json
        id: proverki
        shell: bash
        run: |
          set -uo pipefail
          # Коробка кладёт репозиторий в /rabota, описания на это рассчитывают.
          sudo ln -sfn "$GITHUB_WORKSPACE" /rabota
          cd /rabota
          node - <<'JS'
          const fs = require('fs'), { spawnSync } = require('child_process');
          const put = ['.cibox/korobka.json', '.jarvis/korobka.json'].find(p => fs.existsSync(p));
          const out = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
          const itog = (zeleno, upali, zametka = '') => {
            out('zeleno', zeleno ? '1' : '0'); out('upali', upali.join(', ').slice(0, 100)); out('zametka', zametka);
          };
          if (!put) { console.log('нет описания проверок'); itog(false, [], 'нет описания'); process.exit(0); }
          const m = JSON.parse(fs.readFileSync(put, 'utf8'));
          const E = process.env;
          const PUTI = {
            node24: [E.NODE24_BIN], node22: [E.NODE22_BIN], bun: [E.BUN_BIN, E.NODE24_BIN],
            python313: [E.PY313_BIN, E.NODE24_BIN], python312: [E.PY312_BIN, E.NODE24_BIN], podman: [E.NODE24_BIN],
          };
          const SLUZHBY = { postgres18: 'docker.io/library/postgres:18', pgvector16: 'docker.io/pgvector/pgvector:pg16' };
          const sh = (cmd, okr = {}, obraz = m.obraz) => {
            const puti = PUTI[obraz];
            if (!puti) return { kod: 125, zametka: `образ ${obraz} на GitHub не поддержан` };
            const env = { ...E, ...(m.okruzhenie || {}), ...okr, CI: 'true', PATH: [...puti, E.PATH].join(':') };
            const r = spawnSync('bash', ['-c', cmd], { stdio: 'inherit', env, cwd: '/rabota' });
            return { kod: r.status ?? 1 };
          };
          fs.mkdirSync('/rabota/.tmp', { recursive: true });
          for (const s of m.sluzhby || []) {
            const obraz = SLUZHBY[s.obraz];
            if (!obraz) { itog(false, [`служба ${s.obraz}`], 'служба не поддержана'); process.exit(0); }
            const okr = Object.entries(s.okruzhenie || {}).flatMap(([k, v]) => ['-e', `${k}=${v}`]);
            spawnSync('docker', ['run', '-d', '--network', 'host', ...okr, obraz, 'postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off'], { stdio: 'inherit' });
            let gotova = false;
            for (let i = 0; i < 60 && !gotova; i++) { gotova = spawnSync('pg_isready', ['-h', '127.0.0.1']).status === 0; if (!gotova) spawnSync('sleep', ['1']); }
            if (!gotova) { itog(false, [`служба ${s.obraz}`], 'служба не поднялась'); process.exit(0); }
          }
          const upali = [], stroki = ['| Проверка | Итог | Время |', '|---|---|---|'];
          const shag = (imya, cmd, obraz) => {
            console.log(`::group::${imya}`); const t = Date.now(); const r = sh(cmd, {}, obraz || m.obraz); console.log('::endgroup::');
            const ok = r.kod === 0; if (!ok) upali.push(imya);
            stroki.push(`| ${imya} | ${ok ? '✓' : '× код ' + r.kod + (r.zametka ? ' — ' + r.zametka : '')} | ${Math.round((Date.now() - t) / 1000)} с |`);
            return ok;
          };
          if (m.sborka && !shag('Сборка', m.sborka, m.obraz)) { /* как в Коробке: без сборки проверки не идут */ }
          else for (const p of m.proverki || []) { if (!p.imya.startsWith('Безопасность: ')) shag(p.imya, p.komanda, p.obraz); }
          fs.appendFileSync(E.GITHUB_STEP_SUMMARY, `### Сверка Коробки на GitHub\n\n${stroki.join('\n')}\n`);
          itog(upali.length === 0, upali);
          JS

      - if: always() && steps.nuzhna.outputs.da == '1'
        name: Итог в статус github
        env:
          GH_TOKEN: ${{ github.token }}
          ZELENO: ${{ steps.proverki.outputs.zeleno }}
          UPALI: ${{ steps.proverki.outputs.upali }}
        run: |
          if [ "$ZELENO" = "1" ]; then st=success; op="GitHub: зелено"
          else st=failure; op="GitHub: красно${UPALI:+ — не прошли: $UPALI}"; fi
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$st" -f context=github \
            -f description="${op:0:140}" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null
          echo "$op"
