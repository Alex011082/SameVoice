name: Migrate SpeakEasy source

on:
  push:
    paths:
      - '.migration/READY'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct migration archive
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/payload.part* > /tmp/speakeasy.b64
          base64 --decode /tmp/speakeasy.b64 > /tmp/speakeasy.tar.xz
          tar -tJf /tmp/speakeasy.tar.xz >/dev/null

      - name: Extract source baseline
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/speakeasy.tar.xz -C .
          rm -rf .migration
          rm -f .github/workflows/migrate-speakeasy.yml

      - name: Commit migrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Migrate SpeakEasy source baseline'
          git push origin "HEAD:${GITHUB_REF_NAME}"
