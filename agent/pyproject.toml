[project]
name = "speakeasy-agent"
version = "0.1.0"
description = "SpeakEasy translation relay agent (Stage 0)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "livekit-agents==1.7.0",
    "aiohttp~=3.10",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
# Real cloud providers. A mock-only install must stay lean, so these are opt-in:
#   uv sync --extra api
api = [
    "livekit-plugins-deepgram==1.7.0",
    "livekit-plugins-cartesia==1.7.0",
]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.0,<2",
]

[project.scripts]
speakeasy-agent = "speakeasy_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakeasy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.0,<2",
]
