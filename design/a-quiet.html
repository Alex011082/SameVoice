<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05030e">
<title>SameVoice — тишина и голос</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600;800&amp;family=Rubik:ital,wght@0,300;0,400;0,500;0,600;1,300&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#05030e; --bg1:#0b0722; --ink:#eae6ff; --dim:#6f6a92; --dim2:#4a4570;
  --el:#4d5bff; --cy:#22e3ff; --mg:#ff3df2;
  --f-disp:'Unbounded','Rubik','Arial Black',system-ui,sans-serif;
  --f-text:'Rubik',-apple-system,'Segoe UI',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 700px at 72% -8%, #170d38 0%, transparent 60%),
    radial-gradient(900px 700px at 6% 108%, #0b1d33 0%, transparent 55%),
    var(--bg0);
  color:var(--ink); font-family:var(--f-text); overscroll-behavior:none;
}
.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px}
.phone{
  position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;
  border:1px solid rgba(160,150,255,.14);
  box-shadow:0 44px 120px -28px rgba(30,10,90,.85), inset 0 0 0 1px rgba(255,255,255,.04);
  background:var(--bg0);
}
@media (min-width:480px) and (max-height:920px){.phone{transform:scale(.88)}}
@media (min-width:480px) and (max-height:800px){.phone{transform:scale(.76)}}
@media (max-width:479px){
  .stage{padding:0}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;border:none;box-shadow:none;transform:none}
}
.app{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(520px 380px at 88% -4%, rgba(84,42,190,.20), transparent 65%),
    radial-gradient(440px 440px at -6% 104%, rgba(0,122,190,.13), transparent 60%),
    linear-gradient(180deg,#070312,#0a0620 60%,#060310);
}
.app::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.28) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 9%,  rgba(180,220,255,.24) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 30%, rgba(255,180,250,.16) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 54%, rgba(255,255,255,.14) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 62%, rgba(160,200,255,.18) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 8% 80%, rgba(200,180,255,.14) 50%, transparent 51%),
    radial-gradient(1px 1px at 52% 92%, rgba(255,255,255,.16) 50%, transparent 51%);
}
.screen{position:absolute;inset:0;z-index:1}
#cosmos{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
button{font-family:inherit;background:none;border:0;color:inherit;cursor:pointer}

/* ---------- HOME ---------- */
.home{padding:50px 22px 12px;display:flex;flex-direction:column;
  transition:transform .55s cubic-bezier(.3,.85,.25,1), opacity .55s;}
.home.under{transform:scale(.93) translateY(-10px);opacity:.35}
.brand{font:600 10px var(--f-disp);letter-spacing:.5em;color:var(--dim);text-transform:lowercase}
h1{font:800 44px/1.04 var(--f-disp);margin:10px 0 6px;
  background:linear-gradient(92deg,var(--el) 0%,var(--cy) 46%,var(--mg) 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shim 8s ease-in-out infinite alternate;}
@keyframes shim{from{background-position:0% 0}to{background-position:100% 0}}
.hint{font:300 11px var(--f-text);color:var(--dim);letter-spacing:.08em;margin-bottom:8px}
#list{flex:1;display:flex;flex-direction:column;margin-top:6px;overflow:hidden}

.c{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.c .hd{position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.sv .hd{height:76px}
.strand{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.name{position:relative;z-index:1;font:600 26px var(--f-disp);
  text-shadow:0 0 16px rgba(5,3,14,.95),0 0 5px rgba(5,3,14,.9);}
.tag{position:relative;z-index:1;font:400 10px var(--f-text);color:var(--dim);
  letter-spacing:.16em;text-transform:uppercase;text-align:right;
  text-shadow:0 0 10px rgba(5,3,14,.9);}

.ln{margin-top:4px}
.sv + .ln{margin-top:26px}
.ln .hd{height:52px}
.ln .name{font:300 20px var(--f-text);color:#b9b4cd;display:flex;align-items:center;gap:10px;text-shadow:none}
.ln .hs{flex:none;opacity:.85}
.ln .num{font:300 12px var(--f-text);color:var(--dim);letter-spacing:.06em;direction:ltr}
.flat{position:relative;height:12px;margin:0 6px}
.flat::before{content:'';position:absolute;left:0;right:0;top:5px;height:1px;
  background:repeating-linear-gradient(90deg,rgba(190,195,220,.38) 0 7px,transparent 7px 14px);}
.flat i{position:absolute;top:3px;left:0;width:5px;height:5px;border-radius:50%;
  background:rgba(205,210,235,.85);box-shadow:0 0 8px rgba(205,210,235,.6);
  animation:dial 3.6s linear infinite;}
@keyframes dial{0%{left:0;opacity:0}8%{opacity:.9}92%{opacity:.9}100%{left:calc(100% - 5px);opacity:0}}

.ctx{max-height:0;opacity:0;overflow:hidden;padding:0 6px;
  transition:max-height .5s cubic-bezier(.3,.9,.3,1),opacity .4s,padding .4s;}
.c.open .ctx{max-height:200px;opacity:1;padding-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px 20px;margin:2px 0 14px}
.chip{font:italic 300 13px var(--f-text);color:#a79fd6;position:relative;padding-left:14px;
  animation:bob 4.6s ease-in-out infinite;}
.chip:nth-child(2n){animation-delay:1.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.chip::before{content:'';position:absolute;left:0;top:.5em;width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--cy),var(--mg));opacity:.85;}
.ln .chip::before{background:rgba(200,205,230,.7)}
.themes{display:flex;gap:34px;position:relative;margin:0 0 16px;padding:5px 8px 0}
.themes::before{content:'';position:absolute;left:10px;right:34%;top:11.5px;height:1px;
  background:linear-gradient(90deg,rgba(122,110,210,.55),rgba(122,110,210,.06));}
.th{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;
  font:400 11px var(--f-text);letter-spacing:.1em;color:var(--dim);}
.th b{display:block;width:11px;height:11px;border-radius:50%;
  border:1.5px solid rgba(150,140,230,.55);background:transparent;transition:.25s;}
.th.on{color:var(--ink)}
.th.on b{background:linear-gradient(135deg,var(--el),var(--cy),var(--mg));
  border-color:transparent;box-shadow:0 0 14px rgba(130,80,255,.85);}
.act{display:flex;align-items:center;justify-content:space-between}
.sw{font:300 10px var(--f-text);color:var(--dim2);letter-spacing:.22em;text-transform:uppercase}
.go{font:500 11.5px var(--f-disp);letter-spacing:.12em;color:var(--ink);
  padding:10px 18px;border-radius:999px;border:1px solid transparent;
  background:linear-gradient(var(--bg1),var(--bg1)) padding-box,
             linear-gradient(90deg,var(--el),var(--cy),var(--mg)) border-box;}
.ln .go{color:#c8c4da;
  background:linear-gradient(var(--bg1),var(--bg1)) padding-box,
             linear-gradient(90deg,#8b93ad,#d8dcef) border-box;}

/* ---------- CALL ---------- */
.call{z-index:5;transform:translateY(105%);touch-action:none;
  transition:transform .6s cubic-bezier(.3,.85,.25,1);
  background:
    radial-gradient(430px 300px at 50% 52%, rgba(92,42,205,.16), transparent 70%),
    linear-gradient(180deg,#070313 0%,#0c0724 55%,#070313 100%);}
.call.on{transform:translateY(0)}
.call.drag{transition:none}
#cw{position:absolute;inset:0;width:100%;height:100%}
.ghosts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gw{position:absolute;font:italic 300 15px var(--f-text);color:#cfc8ff;opacity:0;
  text-shadow:0 0 12px rgba(90,60,210,.6);animation:rise 3.4s ease-out forwards;}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}18%{opacity:.55}100%{opacity:0;transform:translateY(-110px)}}
.callui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:60px 24px 32px;pointer-events:none;transition:opacity 1.1s;}
.call.hush .callui{opacity:0}
.chead{text-align:center}
.cname{font:600 38px/1.1 var(--f-disp);color:var(--ink)}
.cname[dir="rtl"]{font-family:var(--f-text);font-weight:600;font-size:46px}
.calt{font:300 13px var(--f-text);color:var(--dim);margin-top:6px;letter-spacing:.14em}
.cmeta{margin-top:12px;font:300 11.5px var(--f-text);color:var(--dim);
  display:flex;gap:14px;justify-content:center;}
#ctimer{font-variant-numeric:tabular-nums;letter-spacing:.2em;color:#8f88b8}
.cfoot{display:flex;flex-direction:column;align-items:center;gap:15px}
.dir{display:flex;align-items:center;gap:18px;justify-content:center}
.end{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;
  opacity:.4;transition:.35s;}
.end .nm{font:500 14px var(--f-text);color:var(--ink)}
.end i{font-style:normal;font:400 9px var(--f-text);letter-spacing:.22em;
  text-transform:uppercase;color:var(--dim);}
.end.live{opacity:1;transform:scale(1.07);filter:drop-shadow(0 0 10px rgba(100,120,255,.65))}
.flow{display:flex;justify-content:center;gap:6px;width:56px}
.flow b{width:4px;height:4px;border-radius:50%;background:var(--cy);
  box-shadow:0 0 6px var(--cy);animation:fl 1.15s linear infinite;}
.flow b:nth-child(2){animation-delay:.18s}
.flow b:nth-child(3){animation-delay:.36s}
@keyframes fl{0%{transform:translateX(-15px);opacity:0}30%{opacity:1}100%{transform:translateX(15px);opacity:0}}
.dir.rev .flow b{animation-name:flr;background:var(--mg);box-shadow:0 0 6px var(--mg)}
@keyframes flr{0%{transform:translateX(15px);opacity:0}30%{opacity:1}100%{transform:translateX(-15px);opacity:0}}
.dir.idle .flow b{animation-play-state:paused;opacity:.22}
.hear{font:italic 300 12.5px var(--f-text);color:#9d95c8;min-height:18px;opacity:0;transition:opacity .5s}
.hear.show{opacity:1}
.endr{pointer-events:auto;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(160,150,230,.35);display:flex;align-items:center;justify-content:center;
  background:rgba(10,6,30,.4);animation:brt 3.2s ease-in-out infinite;}
@keyframes brt{0%,100%{box-shadow:0 0 0 0 rgba(140,120,255,0)}50%{box-shadow:0 0 18px 0 rgba(140,120,255,.35)}}
.endr .vv{width:9px;height:9px;border-right:1.6px solid #b9b2e6;border-bottom:1.6px solid #b9b2e6;
  transform:rotate(45deg) translate(-1px,-1px);}
.endhint{font:300 9.5px var(--f-text);letter-spacing:.26em;text-transform:uppercase;color:var(--dim2)}

.hm{display:inline}.hd-hint{display:none}
@media (hover:hover) and (pointer:fine){.hm{display:none}.hd-hint{display:inline}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.15s!important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="app">
      <canvas id="cosmos"></canvas>

      <section id="home" class="screen home">
        <div class="brand">samevoice</div>
        <h1>голоса.</h1>
        <div class="hint">
          <span class="hm">тап — память пары &middot; свайп &#8593; — звонок</span>
          <span class="hd-hint">клик — память пары &middot; &laquo;позвонить&raquo; — звонок</span>
        </div>
        <div id="list"></div>
      </section>

      <section id="call" class="screen call" aria-hidden="true">
        <canvas id="cw"></canvas>
        <div class="ghosts" id="ghosts"></div>
        <div class="callui">
          <header class="chead">
            <div class="cname" id="cname"></div>
            <div class="calt" id="calt"></div>
            <div class="cmeta"><span id="ctheme"></span><span id="ctimer">0:00</span></div>
          </header>
          <footer class="cfoot">
            <div class="dir idle" id="dir">
              <span class="end" id="endMe"><span class="nm">ты</span><i>ру</i></span>
              <span class="flow"><b></b><b></b><b></b></span>
              <span class="end" id="endThem"><span class="nm" id="dnm"></span><i id="dlang"></i></span>
            </div>
            <div class="hear" id="hear"></div>
            <div class="endr" id="endr" title="завершить"><span class="vv"></span></div>
            <div class="endhint">вниз — завершить</div>
          </footer>
        </div>
      </section>

    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

var HS = '<svg class="hs" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">'
 + '<path d="M6.5 3C5 3 3.6 4.3 3.8 5.9c.8 7 6.3 13.5 14.3 14.3 1.6.2 2.9-1.2 2.9-2.7v-1.9c0-.8-.5-1.4-1.2-1.7l-2.6-1c-.6-.2-1.3 0-1.7.5l-.9 1c-2.5-1.2-4.5-3.2-5.7-5.7l1-.9c.5-.4.7-1.1.5-1.7l-1-2.6C9.1 3.5 8.4 3 7.7 3z" '
 + 'fill="none" stroke="rgba(185,180,205,.75)" stroke-width="1.4"/></svg>';

var C = [
 {id:'tsipi', kind:'sv', name:'ציפי', rtl:true, alt:'Ципи', lang:'עברית', hues:[186,318],
  chips:['керамика по вт','спросить про печь'],
  me:'она слышит иврит — твоим голосом', them:'ты слышишь русский — её голосом',
  words:['обжиг…','во вторник','глазурь','привезу']},
 {id:'amin', kind:'sv', name:'Амин', alt:'אמין', lang:'עברית', hues:[222,268],
  chips:['коллега','смета — до пятницы'],
  me:'он слышит иврит — твоим голосом', them:'ты слышишь русский — его голосом',
  words:['смета…','к пятнице','подрядчик','счёт']},
 {id:'mama', kind:'sv', name:'мама', alt:'', ru:true, lang:'ру', hues:[268,330],
  chips:['садик для Лёвы','врач в четверг'],
  me:'без перевода — просто твой голос', them:'просто её голос — как рядом',
  words:['садик…','в четверг','заберу','Лёва']},
 {id:'ronit', kind:'sv', name:'רונית', rtl:true, alt:'Ронит', lang:'עברית', hues:[158,232],
  chips:['риелтор · Хайфа','3 комнаты, до 2,4 млн'],
  me:'она слышит иврит — твоим голосом', them:'ты слышишь русский — её голосом',
  words:['квартира…','Хайфа','смотреть','залог']},
 {id:'igor', kind:'ln', name:'Игорь', num:'+972 54 833 1187', lang:'ру',
  chips:['сантехник','кран на кухне'],
  me:'внешняя линия — без перевода', them:'обычный звонок',
  words:['кран…','приедет','запчасть']},
 {id:'shula', kind:'ln', name:'Шула · банк', num:'+972 3 567 4400', lang:'עברית',
  chips:['ипотека','вт, 12:00'],
  me:'она слышит иврит — твоим голосом', them:'ты слышишь русский — тембр нейтральный',
  words:['ипотека…','ставка','во вторник']}
];

var homeEl = document.getElementById('home'),
    callEl = document.getElementById('call'),
    listEl = document.getElementById('list'),
    cw = document.getElementById('cw'),
    ghosts = document.getElementById('ghosts'),
    cname = document.getElementById('cname'),
    calt = document.getElementById('calt'),
    cthemeEl = document.getElementById('ctheme'),
    ctimer = document.getElementById('ctimer'),
    dirEl = document.getElementById('dir'),
    endMe = document.getElementById('endMe'),
    endThem = document.getElementById('endThem'),
    dnm = document.getElementById('dnm'),
    dlang = document.getElementById('dlang'),
    hearEl = document.getElementById('hear'),
    endr = document.getElementById('endr');

var S = {active:null, closing:false, tOn:0, boost:0, pull:{}, open:null, theme:{}, t0:0};
var sp = {who:null, prev:'them', until:0, eM:0, eT:0};
var lastTouch = 0, lastGhost = 0, timerInt = null, lastT = 0;

function pnow(){ return performance.now()/1000; }
function lerp(a,b,m){ return a+(b-a)*m; }
function fit(cv){
  var r = cv.getBoundingClientRect();
  var d = Math.min(window.devicePixelRatio||1, 2);
  cv._w = r.width; cv._h = r.height;
  cv.width = Math.max(1, Math.round(r.width*d));
  cv.height = Math.max(1, Math.round(r.height*d));
  cv.getContext('2d').setTransform(d,0,0,d,0,0);
}
function grad(x,w,h1,h2,sat,a){
  var g = x.createLinearGradient(0,0,w,0);
  g.addColorStop(0,'hsla('+h1+','+sat+'%,62%,'+a+')');
  g.addColorStop(.5,'hsla('+((h1+h2)/2)+','+sat+'%,68%,'+a+')');
  g.addColorStop(1,'hsla('+h2+','+sat+'%,62%,'+a+')');
  return g;
}

/* ---- build rows ---- */
C.forEach(function(c){
  var el = document.createElement('article');
  el.className = 'c ' + c.kind;
  var html = '';
  if (c.kind === 'sv') {
    html += '<div class="hd">'
      + '<span class="name"' + (c.rtl ? ' dir="rtl"' : '') + '>' + c.name + '</span>'
      + '<span class="tag">' + (c.ru ? 'ру ⇄ ру' : '<bdi dir="rtl">עב</bdi> ⇄ ру') + '</span>'
      + '<canvas class="strand"></canvas></div>'
      + '<div class="ctx">'
      + '<div class="chips">' + c.chips.map(function(x){return '<span class="chip">'+x+'</span>';}).join('') + '</div>'
      + '<div class="themes">' + ['работа','семья','быт'].map(function(t){
          return '<button class="th" data-t="'+t+'"><b></b>'+t+'</button>';}).join('') + '</div>'
      + '<div class="act"><span class="sw">свайп ↑ — звонок</span><button class="go">позвонить ↑</button></div>'
      + '</div>';
  } else {
    html += '<div class="hd">'
      + '<span class="name">' + HS + c.name + '</span>'
      + '<span class="num">' + c.num + '</span></div>'
      + '<div class="flat"><i></i></div>'
      + '<div class="ctx">'
      + '<div class="chips">' + c.chips.map(function(x){return '<span class="chip">'+x+'</span>';}).join('') + '</div>'
      + '<div class="act"><span class="sw">свайп ↑ — звонок</span><button class="go">позвонить ↑</button></div>'
      + '</div>';
  }
  el.innerHTML = html;
  listEl.appendChild(el);
  c.el = el;
  c.ph = Math.random()*6.28;
  if (c.kind === 'sv') { c.cv = el.querySelector('.strand'); c.nameEl = el.querySelector('.name'); }
  wire(el, c);
});

function toggleOpen(c){
  if (S.open && S.open !== c) S.open.el.classList.remove('open');
  var was = c.el.classList.contains('open');
  c.el.classList.toggle('open', !was);
  S.open = was ? null : c;
  if (RM) setTimeout(renderStatic, 180);
}

function wire(el, c){
  var g = null;
  el.addEventListener('pointerdown', function(e){
    if (S.active) return;
    if (e.target.closest('button')) return;
    g = {y:e.clientY, moved:false, pull:0};
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });
  el.addEventListener('pointermove', function(e){
    if (!g) return;
    var dy = e.clientY - g.y;
    if (Math.abs(dy) > 6) g.moved = true;
    if (dy < 0) {
      g.pull = Math.min(-dy, 90);
      el.style.transform = 'translateY(' + (-g.pull*0.55) + 'px)';
      S.pull[c.id] = g.pull/90;
    } else {
      g.pull = 0; S.pull[c.id] = 0; el.style.transform = '';
    }
  });
  function release(e){
    if (!g) return;
    var fire = g.moved && g.pull > 60;
    el.style.transition = 'transform .3s cubic-bezier(.3,.9,.3,1)';
    el.style.transform = '';
    setTimeout(function(){ el.style.transition=''; }, 320);
    S.pull[c.id] = 0;
    var tap = !g.moved;
    g = null;
    if (fire) startCall(c);
    else if (tap && e.type === 'pointerup') toggleOpen(c);
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.querySelectorAll('.th').forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      var t = b.dataset.t;
      var on = b.classList.contains('on');
      el.querySelectorAll('.th').forEach(function(x){ x.classList.remove('on'); });
      if (!on) { b.classList.add('on'); S.theme[c.id] = t; }
      else delete S.theme[c.id];
    });
  });
  var go = el.querySelector('.go');
  if (go) go.addEventListener('click', function(ev){ ev.stopPropagation(); startCall(c); });
}

function nameEnd(c){
  if (!c.nameEl) return 0;
  if (c.nameW == null) c.nameW = c.nameEl.offsetWidth + 16;
  return c.nameW;
}
function forgetNameW(){ C.forEach(function(c){ c.nameW = null; }); }
addEventListener('resize', forgetNameW);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(forgetNameW);

/* ---- waves ---- */
function strand(cv, t, amp, h1, h2, x0){
  if (!cv._w) return;
  var x = cv.getContext('2d'), w = cv._w, h = cv._h;
  x.clearRect(0,0,w,h);
  /* x0 — правый край имени: нить рождается ИЗ человека и уходит вправо.
     Без этого линия шла через всё поле и перечёркивала имя. */
  var s = Math.max(0, Math.min(x0 || 0, w - 40)), span = w - s;
  for (var k=0; k<3; k++){
    var a = [.9,.5,.3][k], lw = [1.8,1.2,.8][k], ph = k*2.1,
        f = .021 + k*.006, spd = .9 + k*.35;
    x.beginPath();
    for (var px=s; px<=w; px+=3){
      var u = (px - s) / span;
      var env = Math.sin(Math.PI*u) * Math.min(1, u*7);
      var y = h/2 + env*( Math.sin(px*f + t*spd + ph)*amp
                        + Math.sin(px*.052 - t*1.7 + ph*1.7)*amp*.45 );
      if (px===s) x.moveTo(px,y); else x.lineTo(px,y);
    }
    x.strokeStyle = grad(x,w,h1,h2,92,a);
    x.lineWidth = lw;
    if (k===0 && !RM){ x.shadowColor = 'hsla('+((h1+h2)/2)+',95%,60%,.55)'; x.shadowBlur = 10; }
    else x.shadowBlur = 0;
    x.stroke();
  }
  x.shadowBlur = 0;
}

function drawCall(t, dt){
  if (!cw._w) return;
  var x = cw.getContext('2d'), w = cw._w, h = cw._h;
  x.clearRect(0,0,w,h);
  var c = S.active; if (!c) return;
  var hush = callEl.classList.contains('hush');
  var e = Math.max(sp.eM, sp.eT); window.__voiceE = e;
  var n = .6 + .4*Math.sin(t*11.3 + Math.sin(t*5.1)*2.2);
  var amp = 12 + e*64*n;
  amp *= (1 + S.boost*.9);
  if (hush) amp = 13 + Math.sin(t*.75)*6;
  if (dt) S.boost *= Math.max(0, 1 - dt*1.6);
  var mix = sp.eT / ((sp.eM + sp.eT) || 1); /* 1 = they speak */
  var mono = c.kind === 'ln';
  var bh = c.hues || [215,258];
  var h1 = lerp(215, bh[0], mix), h2 = lerp(258, bh[1], mix);
  var sat = mono ? lerp(85, 12, mix) : 92;
  var cy0 = h*.5;
  /* under-glow */
  x.beginPath();
  for (var px=0; px<=w; px+=4){
    var env = Math.pow(Math.sin(Math.PI*px/w), .9);
    var y = cy0 + env*Math.sin(px*.010 + t*.9)*amp;
    if (px===0) x.moveTo(px,y); else x.lineTo(px,y);
  }
  x.strokeStyle = grad(x,w,h1,h2,sat,.07); x.lineWidth = 9; x.shadowBlur = 0; x.stroke();
  for (var k=0; k<5; k++){
    var a = [.85,.5,.35,.25,.17][k], lw = [2.4,1.6,1.2,1,.8][k],
        ph = k*1.9, f = .008 + k*.0035, spd = .7 + k*.3,
        la = amp*(1 - k*.13);
    x.beginPath();
    for (px=0; px<=w; px+=3){
      env = Math.pow(Math.sin(Math.PI*px/w), .9);
      y = cy0 + env*( Math.sin(px*f + t*spd + ph)*la
                    + Math.sin(px*.027 - t*1.35 + ph*1.6)*la*.5
                    + Math.sin(px*.061 + t*2.2 + ph)*la*.18 );
      if (px===0) x.moveTo(px,y); else x.lineTo(px,y);
    }
    x.strokeStyle = grad(x,w,h1,h2,sat,a);
    x.lineWidth = lw;
    if (k===0 && !RM){ x.shadowColor = 'hsla('+((h1+h2)/2)+','+sat+'%,60%,.6)'; x.shadowBlur = 16; }
    else x.shadowBlur = 0;
    x.stroke();
  }
  x.shadowBlur = 0;
}

/* ---- speech sim ---- */
function setSpk(w){
  var c = S.active; if (!c) return;
  dirEl.classList.toggle('rev', w==='them');
  dirEl.classList.toggle('idle', !w);
  endMe.classList.toggle('live', w==='me');
  endThem.classList.toggle('live', w==='them');
  if (w){ hearEl.textContent = (w==='me') ? c.me : c.them; hearEl.classList.add('show'); }
  else hearEl.classList.remove('show');
}
function speech(t, dt){
  if (RM) return;
  if (t > sp.until){
    if (sp.who){ sp.prev = sp.who; sp.who = null; sp.until = t + .5 + Math.random(); }
    else { sp.who = (sp.prev==='me') ? 'them' : 'me'; sp.until = t + 2.2 + Math.random()*2.6; }
    setSpk(sp.who);
  }
  sp.eM += (((sp.who==='me')?1:0) - sp.eM) * Math.min(1, dt*5);
  sp.eT += (((sp.who==='them')?1:0) - sp.eT) * Math.min(1, dt*5);
  if (sp.who==='me' && t - lastGhost > 2.4 && S.active && S.active.words){
    lastGhost = t + Math.random()*1.5;
    spawnGhost();
  }
}
function spawnGhost(){
  var c = S.active; if (!c) return;
  var s = document.createElement('span');
  s.className = 'gw';
  s.textContent = c.words[Math.floor(Math.random()*c.words.length)];
  s.style.left = (16 + Math.random()*56) + '%';
  s.style.bottom = (34 + Math.random()*14) + '%';
  ghosts.appendChild(s);
  s.addEventListener('animationend', function(){ s.remove(); });
}

/* ---- call flow ---- */
function updTimer(){
  var s = Math.floor((performance.now() - S.t0)/1000);
  ctimer.textContent = Math.floor(s/60) + ':' + ('0' + s%60).slice(-2);
}
function startCall(c){
  if (S.active || S.closing) return;
  S.active = c; S.t0 = performance.now(); S.tOn = pnow(); S.boost = 0;
  cname.textContent = c.name;
  if (c.rtl) cname.setAttribute('dir','rtl'); else cname.removeAttribute('dir');
  calt.textContent = (c.kind==='ln') ? c.num : (c.alt || '');
  var th = S.theme[c.id];
  cthemeEl.textContent = th ? ('тема · ' + th) : (c.kind==='ln' ? 'внешняя линия' : '');
  dnm.textContent = c.name;
  if (c.rtl) dnm.setAttribute('dir','rtl'); else dnm.removeAttribute('dir');
  dlang.textContent = c.lang;
  if (c.lang !== 'ру') dlang.setAttribute('dir','rtl'); else dlang.removeAttribute('dir');
  hearEl.classList.remove('show');
  ctimer.textContent = '0:00';
  fit(cw);
  callEl.classList.add('on');
  callEl.setAttribute('aria-hidden','false');
  homeEl.classList.add('under');
  lastTouch = pnow();
  sp = {who:null, prev:'them', until:pnow() + 1.1, eM:0, eT:0};
  setSpk(null);
  timerInt = setInterval(updTimer, 500);
  if (RM) setTimeout(function(){ setSpk('them'); sp.eT = 1; renderStatic(); }, 400);
}
function endCall(){
  if (!S.active || S.closing) return;
  S.closing = true;
  clearInterval(timerInt);
  callEl.classList.remove('drag','hush');
  callEl.style.transform = '';
  callEl.classList.remove('on');
  homeEl.classList.remove('under');
  setTimeout(function(){
    S.active = null; S.closing = false;
    callEl.setAttribute('aria-hidden','true');
    ghosts.innerHTML = '';
    if (RM) renderStatic();
  }, 620);
}
endr.addEventListener('click', function(e){ e.stopPropagation(); endCall(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') endCall();
});

/* call gestures: down = hang up, up = louder */
var cg = null;
callEl.addEventListener('pointerdown', function(e){
  if (!S.active || S.closing) return;
  lastTouch = pnow();
  callEl.classList.remove('hush');
  if (e.target.closest('.endr')) return;
  cg = {y:e.clientY};
  callEl.classList.add('drag');
  try { callEl.setPointerCapture(e.pointerId); } catch(err){}
});
callEl.addEventListener('pointermove', function(e){
  if (!cg) return;
  lastTouch = pnow();
  var dy = e.clientY - cg.y;
  if (dy > 0){
    callEl.style.transform = 'translateY(' + dy*.85 + 'px)';
  } else {
    S.boost = Math.min(1.3, -dy/130);
    callEl.style.transform = '';
  }
});
function crel(e){
  if (!cg) return;
  var dy = e.clientY - cg.y;
  cg = null;
  callEl.classList.remove('drag');
  callEl.style.transform = '';
  if (dy > 140) endCall();
}
callEl.addEventListener('pointerup', crel);
callEl.addEventListener('pointercancel', crel);

/* ---- main loop ---- */
function frame(ts){
  var t = ts/1000;
  var dt = Math.min(.05, t - (lastT || t));
  lastT = t;
  var homeVisible = !S.active || S.closing || (t - S.tOn < .8);
  if (homeVisible){
    C.forEach(function(c){
      if (c.kind !== 'sv' || !c.cv) return;
      var open = c.el.classList.contains('open');
      var pull = S.pull[c.id] || 0;
      var amp = 4.5 + (open?3:0) + pull*26 + Math.sin(t*1.3 + c.ph)*1.2;
      strand(c.cv, t*.9 + c.ph, amp, c.hues[0], c.hues[1], nameEnd(c));
    });
  }
  if (S.active){
    if (!S.closing){
      speech(t, dt);
      if (t - lastTouch > 3) callEl.classList.add('hush');
      else callEl.classList.remove('hush');
    }
    drawCall(t, dt);
  }
  requestAnimationFrame(frame);
}

function renderStatic(){
  C.forEach(function(c){
    if (c.kind !== 'sv' || !c.cv) return;
    fit(c.cv);
    strand(c.cv, 2.4 + c.ph, 6, c.hues[0], c.hues[1], nameEnd(c));
  });
  if (S.active){ fit(cw); drawCall(2.2, 0); }
}

function fitAll(){
  C.forEach(function(c){ if (c.cv) fit(c.cv); });
  if (S.active) fit(cw);
  if (RM) renderStatic();
}
window.addEventListener('resize', fitAll);
fitAll();
if (RM) renderStatic();
else requestAnimationFrame(frame);
})();
</script>
<script>
/* КОСМОС: глубина под интерфейсом. Три слоя звёзд с параллаксом, дрейфующие
   туманности, редкие падающие звёзды. На экране звонка дышит от голоса
   (window.__voiceE пишет волна). */
(function(){
  var cv = document.getElementById('cosmos'); if (!cv) return;
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,DPR=1, stars=[], dust=[], neb=null, shoot=null, nextShoot=4, drift=0;

  function nebula(){
    /* туманности рисуем один раз в мелком разрешении — при растяжении
       получается мягкое размытие даром */
    var c = document.createElement('canvas');
    c.width = 180; c.height = Math.max(60, Math.round(180*H/(W||1)));
    var g = c.getContext('2d');
    var blobs = [
      {x:.80,y:.05,r:.85,col:'120,70,255'},
      {x:.02,y:.62,r:.75,col:'0,170,235'},
      {x:.62,y:.95,r:.80,col:'255,60,230'},
      {x:.28,y:.34,r:.55,col:'90,120,255'}
    ];
    for (var i=0;i<blobs.length;i++){
      var b = blobs[i], R = b.r*c.width,
          gr = g.createRadialGradient(b.x*c.width,b.y*c.height,0,b.x*c.width,b.y*c.height,R);
      gr.addColorStop(0,'rgba('+b.col+',.30)');
      gr.addColorStop(.45,'rgba('+b.col+',.10)');
      gr.addColorStop(1,'rgba('+b.col+',0)');
      g.fillStyle = gr; g.fillRect(0,0,c.width,c.height);
    }
    return c;
  }

  function build(){
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = r.width; H = r.height;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    stars = [];
    var n = Math.round(W*H/2400);
    for (var i=0;i<n;i++){
      var d = Math.random(), L = d<.55?0:(d<.86?1:2), tint = Math.random();
      stars.push({
        x:Math.random()*W, y:Math.random()*H, L:L,
        r: L===0? .55+Math.random()*.45 : L===1? .85+Math.random()*.6 : 1.25+Math.random()*1.1,
        a: L===0? .26+Math.random()*.18 : L===1? .40+Math.random()*.28 : .58+Math.random()*.34,
        tw:Math.random()*6.283, tws:.35+Math.random()*1.5,
        hue: tint<.14? 195 : (tint<.24? 292 : null)
      });
    }
    dust = [];
    for (var j=0;j<16;j++) dust.push({x:Math.random()*W,y:Math.random()*H,
      r:.4+Math.random()*.8, a:.05+Math.random()*.07,
      vy:-(2+Math.random()*6), vx:(Math.random()-.5)*2.5});
    neb = nebula();
  }

  function draw(t, dt){
    if (!W) return;
    var e = +window.__voiceE || 0;            /* 0..1 — громкость голоса */
    var live = document.getElementById('call');
    var inCall = live && live.getAttribute('aria-hidden') === 'false';
    var pulse = inCall ? e : 0;

    ctx.clearRect(0,0,W,H);

    /* туманности: два прохода со сдвигом — параллакс глубины */
    if (neb){
      ctx.globalCompositeOperation = 'lighter';
      var s1 = Math.sin(t*.045), s2 = Math.cos(t*.031);
      ctx.globalAlpha = .55 + pulse*.35;
      ctx.drawImage(neb, s1*14 - 10, s2*10 - 6, W*1.14, H*1.10);
      ctx.globalAlpha = .34 + pulse*.25;
      ctx.drawImage(neb, -s2*22 - 30, -s1*16 - 40, W*1.32, H*1.28);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    /* звёзды */
    drift += dt*(reduce?0:1);
    for (var i=0;i<stars.length;i++){
      var st = stars[i];
      var y = st.y - drift*(2.5 + st.L*4.5) * .35;
      y = ((y % (H+40)) + (H+40)) % (H+40) - 20;
      var tw = reduce ? .85 : (.62 + .38*Math.sin(t*st.tws + st.tw));
      var a = st.a * tw * (1 + pulse*.5);
      var rr = st.r * (1 + pulse*.22);
      if (st.hue !== null){
        ctx.fillStyle = 'hsla('+st.hue+',100%,'+(st.hue===195?78:74)+'%,'+a.toFixed(3)+')';
      } else {
        ctx.fillStyle = 'rgba(232,236,255,'+a.toFixed(3)+')';
      }
      if (st.L === 2){ ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 6 + pulse*10; }
      ctx.beginPath(); ctx.arc(st.x, y, rr, 0, 6.283); ctx.fill();
      ctx.shadowBlur = 0;
    }

    /* пыль — медленно всплывает */
    if (!reduce) for (var k=0;k<dust.length;k++){
      var p = dust[k];
      p.y += p.vy*dt; p.x += p.vx*dt;
      if (p.y < -6){ p.y = H+6; p.x = Math.random()*W; }
      if (p.x < -6) p.x = W+6; if (p.x > W+6) p.x = -6;
      ctx.fillStyle = 'rgba(200,215,255,'+(p.a*(1+pulse)).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    }

    /* падающая звезда — редко, чтобы оставалась событием */
    if (!reduce){
      nextShoot -= dt;
      if (!shoot && nextShoot <= 0){
        shoot = {x: W*(.15+Math.random()*.7), y: -20, vx: -(60+Math.random()*70),
                 vy: 210+Math.random()*130, life: 0, len: 90+Math.random()*70};
        nextShoot = 7 + Math.random()*11;
      }
      if (shoot){
        shoot.life += dt; shoot.x += shoot.vx*dt; shoot.y += shoot.vy*dt;
        var fade = Math.max(0, 1 - shoot.life/1.5);
        var gx = shoot.x - shoot.vx*.0045*shoot.len, gy = shoot.y - shoot.vy*.0045*shoot.len;
        var g2 = ctx.createLinearGradient(shoot.x, shoot.y, gx, gy);
        g2.addColorStop(0,'rgba(255,255,255,'+(.75*fade).toFixed(3)+')');
        g2.addColorStop(.35,'rgba(120,225,255,'+(.35*fade).toFixed(3)+')');
        g2.addColorStop(1,'rgba(120,225,255,0)');
        ctx.strokeStyle = g2; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(shoot.x,shoot.y); ctx.lineTo(gx,gy); ctx.stroke();
        if (shoot.y > H+60 || fade <= 0) shoot = null;
      }
    }
  }

  var last = 0;
  function loop(ms){
    var t = ms/1000, dt = last ? Math.min(.05, t-last) : 0; last = t;
    draw(t, dt);
    requestAnimationFrame(loop);
  }
  build();
  if (reduce) { draw(0,0); } else { requestAnimationFrame(loop); }
  addEventListener('resize', function(){ build(); if (reduce) draw(0,0); });
  /* контейнер может получить размер позже нас (шрифты, dvh, поворот экрана) —
     пересобираем звёзды, как только он появился или поменялся */
  if (window.ResizeObserver){
    var lastW = 0, lastH = 0;
    new ResizeObserver(function(){
      var r = cv.getBoundingClientRect();
      if (!r.width || !r.height) return;
      if (Math.abs(r.width-lastW) < 1 && Math.abs(r.height-lastH) < 1) return;
      lastW = r.width; lastH = r.height; build(); if (reduce) draw(0,0);
    }).observe(cv);
  }
})();
</script>
