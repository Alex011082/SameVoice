<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SameVoice · язык = цвет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ru:#2726FF;
  --he:#FF4D00;
  --mag:#FF00B4;
  --ink:#16123A;
  --paper:#F3F3F7;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  position:fixed;inset:0;width:100%;overflow:hidden;
  background:#E9E9F0;color:var(--ink);
  font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#phone{
  position:relative;width:100vw;height:100vh;height:100dvh;
  background:var(--paper);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.poster{display:none}
@media (min-width:600px){
  body{
    display:grid;place-items:center;
    background:
      radial-gradient(640px 520px at 10% 6%, rgba(39,38,255,.16), transparent 62%),
      radial-gradient(720px 620px at 90% 94%, rgba(255,77,0,.18), transparent 62%),
      #E9E9F0;
  }
  #phone{
    width:390px;height:min(844px,94vh);border-radius:54px;
    box-shadow:0 44px 96px -22px rgba(22,18,58,.5), 0 0 0 10px #17142C, 0 0 0 12px #3B3757;
  }
}
@media (min-width:960px){
  .poster{
    display:block;position:fixed;top:50%;
    writing-mode:vertical-rl;letter-spacing:.14em;pointer-events:none;
  }
  #posterL{
    left:4vw;transform:translateY(-50%) rotate(180deg);
    font-family:'Unbounded','Rubik',system-ui,sans-serif;font-weight:900;
    font-size:clamp(15px,2.2vw,30px);color:var(--ru);opacity:.85;
  }
  #posterR{
    right:4vw;transform:translateY(-50%);
    font-family:'Karantina','Rubik',sans-serif;font-weight:700;
    font-size:clamp(24px,3.4vw,50px);color:var(--he);opacity:.9;letter-spacing:.08em;
  }
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;visibility:hidden;opacity:0;transition:opacity .28s ease}
.screen.on{visibility:visible;opacity:1}

/* ---------- HOME ---------- */
#homeHead{
  position:absolute;top:0;left:0;right:0;z-index:6;
  padding:max(env(safe-area-inset-top),18px) 22px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;
}
#logo{font-family:'Unbounded','Rubik',system-ui,sans-serif;font-weight:900;font-size:13px;line-height:1.1;letter-spacing:.02em}
#logo .l1{color:var(--ru)}
#logo .l2{color:var(--he)}
#deckTgl{display:flex;gap:14px;align-items:center}
.tgl{
  width:34px;height:34px;border:none;background:transparent;border-radius:12px;
  display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .2s ease;
}
.tgl .blob{
  width:20px;height:20px;border-radius:8px;
  background:linear-gradient(135deg,var(--ru),var(--mag),var(--he));
}
.tgl .ringg{width:19px;height:19px;border-radius:50%;border:2.5px dashed var(--ink);opacity:.85}
.tgl[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink);transform:scale(1.06)}

#dots{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);z-index:6;
  display:flex;flex-direction:column;gap:10px;
}
.dot{
  width:7px;height:7px;border-radius:5px;border:none;padding:0;cursor:pointer;
  background:var(--ink);opacity:.16;transition:all .28s ease;
}
.dot.on{opacity:1;height:24px;background:var(--dotc,var(--ru))}

#deckTag{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);z-index:6;
  writing-mode:vertical-rl;font-size:10px;font-weight:600;
  letter-spacing:.42em;text-transform:uppercase;opacity:.4;cursor:pointer;
  background:none;border:none;color:var(--ink);padding:6px 2px;
}

#wheelZone{
  position:absolute;left:0;right:0;top:64px;bottom:314px;z-index:2;
  perspective:900px;cursor:grab;
}
#wheelZone:active{cursor:grabbing}
#wheelWrap{position:absolute;inset:0;transform-style:preserve-3d}
.slide{
  position:absolute;left:50%;top:50%;width:100%;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  will-change:transform,opacity;
}
.bdg{height:18px;display:block}
.nm{
  white-space:nowrap;font-weight:700;line-height:.98;cursor:pointer;
  padding:0 6px;
}
.nm-ru{font-family:'Unbounded','Rubik',system-ui,sans-serif;letter-spacing:-.02em}
.nm-he{font-family:'Karantina','Rubik','Arial Narrow',sans-serif;font-weight:700;line-height:.8}
.caps{text-transform:uppercase}
.fill-duo{
  background:linear-gradient(100deg,var(--ca) 8%,var(--mag) 46%,var(--cb) 82%,var(--ca) 120%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shim 7s linear infinite alternate;
}
.fill-solid{color:var(--ca)}
.hollow{
  color:transparent;-webkit-text-stroke:3px var(--ca);
  text-decoration:underline;text-decoration-style:dashed;
  text-decoration-color:var(--ca);text-decoration-thickness:3px;
  text-underline-offset:12px;
}
@keyframes shim{to{background-position:200% 0}}

.meta{display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .12s linear;margin-top:4px}
.alt{font-size:11px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;opacity:.5}
.phn{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;letter-spacing:.14em;opacity:.55}
#ctx{
  position:absolute;left:0;right:0;bottom:172px;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:13px;
  padding:0 16px;transition:opacity .15s linear;
}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:340px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;
  font-size:12px;font-weight:500;color:var(--ink);
  border:1.5px solid;background:#fff;
}
.chip svg{width:9px;height:9px;flex:none}
.chip:nth-child(3n+1){transform:rotate(-2.2deg)}
.chip:nth-child(3n+2){transform:rotate(1.6deg)}
.chip:nth-child(3n){transform:rotate(-1deg)}
#ctx.outer .chip{border-style:dashed}
.themes{display:flex;gap:9px;margin-top:3px}
.th{
  font-family:'Unbounded','Rubik',system-ui,sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:9px 13px;border-radius:13px;cursor:pointer;
  border:2px solid var(--ca);color:var(--ca);background:#fff;
  transform:rotate(var(--tr,0deg));transition:all .18s ease;
}
.th.on{background:var(--ca);color:#fff;transform:rotate(var(--tr,0deg)) scale(1.1)}

#pull{
  position:absolute;left:0;right:0;bottom:0;height:156px;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:max(env(safe-area-inset-bottom),20px);
  touch-action:none;pointer-events:none;
}
#trail{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:64px;height:0;border-radius:32px;opacity:.5;
  background:linear-gradient(to top,var(--ca),transparent);
  pointer-events:none;
}
#blob{
  width:94px;height:48px;border-radius:26px 26px 18px 18px;
  background:linear-gradient(120deg,var(--cb),var(--mag),var(--ca));
  background-size:260% 100%;animation:shim 5s linear infinite alternate;
  display:grid;place-items:center;cursor:pointer;border:none;
  box-shadow:0 10px 26px rgba(22,18,58,.25);
  pointer-events:auto;touch-action:none;
  will-change:transform;
}
#blob.spring{transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
#hint{
  margin-top:11px;font-size:9.5px;font-weight:600;
  letter-spacing:.3em;text-transform:uppercase;opacity:.42;
}

/* ---------- CALL ---------- */
#call{background:var(--paper)}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0}
#wave{position:absolute;inset:0;width:100%;height:100%;display:block}
#callInner{position:absolute;inset:0;will-change:transform}
#callHead{
  position:absolute;top:0;left:0;right:0;z-index:3;
  padding-top:max(env(safe-area-inset-top),22px);
  display:flex;flex-direction:column;align-items:center;gap:9px;
  pointer-events:none;
}
#callName{font-weight:700;line-height:1;min-height:52px}
#callName.nm-he{line-height:.85}
#callSub{display:flex;gap:14px;align-items:baseline}
#callKind{font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;opacity:.5}
#callTimer{
  font-family:'Unbounded','Rubik',system-ui,sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.18em;opacity:.8;
  font-variant-numeric:tabular-nums;
}
#dirStrip{display:flex;align-items:center;gap:11px;margin-top:4px}
.dchip{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;
  border:2px solid var(--c);color:var(--c);background:#fff;
  transition:all .3s ease;
}
.dchip.live{background:var(--c);color:#fff}
.flow{width:84px;height:4px;border-radius:2px;position:relative}
.flow i{
  display:block;height:100%;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--fc) 0 9px,transparent 9px 19px);
  animation:dash .5s linear infinite;
}
.flow.f-them i{animation-direction:reverse}
.flow::after{content:'';position:absolute;top:50%;translate:0 -50%;border:6px solid transparent}
.flow.f-you::after{right:-11px;border-left-color:var(--fc);border-right-width:0}
.flow.f-them::after{left:-11px;border-right-color:var(--fc);border-left-width:0}
@keyframes dash{to{background-position:19px 0}}
#callTheme{
  font-family:'Unbounded','Rubik',system-ui,sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 12px;border-radius:11px;color:#fff;background:var(--ca);
  transform:rotate(-2deg);margin-top:2px;
}
#callTheme.none{display:none}

#guess{
  position:absolute;left:0;right:0;top:calc(27% - 22px);z-index:2;
  text-align:center;font-size:9px;font-weight:600;
  letter-spacing:.4em;text-transform:uppercase;opacity:0;
  transition:opacity .25s ease;pointer-events:none;
}
#guess.show{opacity:.4}
.wword{
  position:absolute;left:0;right:0;text-align:center;z-index:2;
  font-weight:700;pointer-events:none;color:var(--wc,var(--ink));
  transition:opacity .5s ease;
}
#srcW{top:27%}
#dstW{top:64%}
.w-ru{font-family:'Unbounded','Rubik',system-ui,sans-serif;letter-spacing:-.01em}
.w-he{font-family:'Karantina','Rubik','Arial Narrow',sans-serif;font-weight:700}
.wword .lt{
  display:inline-block;will-change:transform,opacity;
  transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .5s ease,filter .5s ease;
  transition-delay:calc(var(--i)*28ms);
}
.wword.enter .lt{transform:translate(var(--dx),var(--dy)) rotate(var(--rr));opacity:0;filter:blur(4px)}
.wword.gone .lt{transform:translate(var(--dx),var(--dy)) rotate(var(--rr)) scale(1.5);opacity:0;filter:blur(7px)}
.wword.ghost .lt{color:transparent;-webkit-text-stroke:1.6px var(--wc)}
.wword.ghost{opacity:.45}
.wword.fade{opacity:0}

#hang{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(max(env(safe-area-inset-bottom),16px) + 44px);z-index:4;
  width:56px;height:56px;border-radius:50%;
  border:2.5px solid var(--ink);background:#fff;cursor:pointer;
  display:grid;place-items:center;
  transition:transform .2s ease;
}
#hangHint{
  position:absolute;left:0;right:0;text-align:center;z-index:4;
  bottom:calc(max(env(safe-area-inset-bottom),16px) + 18px);
  font-size:9px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;opacity:.4;
}

/* ---------- flood transition ---------- */
#flood{
  position:absolute;left:-2%;right:-2%;top:-2%;bottom:-2%;z-index:60;
  transform:translateY(103%);pointer-events:none;
  background:linear-gradient(170deg,var(--fa,var(--he)),var(--mag) 55%,var(--ru));
}
#flood.anim{transition:transform .42s cubic-bezier(.7,0,.2,1)}
#flood.cover{transform:translateY(0)}
#flood.up{transform:translateY(-104%)}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  .fill-duo,#blob,.flow i{animation:none}
  .wword .lt{transition:opacity .4s ease}
  .wword.enter .lt,.wword.gone .lt{transform:none;filter:none}
  .screen{transition:opacity .2s ease}
}
</style>
</head>
<body>

<span class="poster" id="posterL" aria-hidden="true">РУССКИЙ — СИНИЙ</span>
<span class="poster" id="posterR" lang="he" aria-hidden="true">עברית — כתום</span>

<div id="phone">

  <!-- ================= HOME ================= -->
  <section id="home" class="screen on" aria-label="Кому позвонить">
    <header id="homeHead">
      <div id="logo" aria-label="SameVoice"><span class="l1">same</span><br><span class="l2">voice</span></div>
      <div id="deckTgl" role="group" aria-label="Внутри или вовне">
        <button class="tgl" id="tglInner" aria-pressed="true" aria-label="Свои — в SameVoice"><span class="blob"></span></button>
        <button class="tgl" id="tglOuter" aria-pressed="false" aria-label="Вовне — обычные номера"><span class="ringg"></span></button>
      </div>
    </header>

    <div id="dots" aria-hidden="true"></div>
    <button id="deckTag" aria-label="Переключить внутри/вовне">внутри · samevoice</button>

    <div id="wheelZone">
      <div id="wheelWrap"></div>
    </div>

    <div id="pull">
      <div id="trail"></div>
      <button id="blob" aria-label="Позвонить — потяни вверх">
        <svg width="26" height="16" viewBox="0 0 26 16" fill="none" aria-hidden="true">
          <path d="M3 13 L13 4 L23 13" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p id="hint">вверх — звонок · вбок — вовне</p>
    </div>
  </section>

  <!-- ================= CALL ================= -->
  <section id="call" class="screen" aria-label="Звонок">
    <div id="tint"></div>
    <canvas id="wave"></canvas>
    <div id="callInner">
      <header id="callHead">
        <h2 id="callName"></h2>
        <div id="callSub"><span id="callKind"></span><span id="callTimer">00:00</span></div>
        <div id="dirStrip">
          <span class="dchip" id="dYou">ты · ру</span>
          <div class="flow f-you" id="flow" aria-hidden="true"><i></i></div>
          <span class="dchip" id="dThem"></span>
        </div>
        <span id="callTheme" class="none"></span>
      </header>
      <p id="guess">догадка</p>
      <div id="srcW" class="wword" aria-hidden="true"></div>
      <div id="dstW" class="wword" aria-hidden="true"></div>
      <button id="hang" aria-label="Сбросить — свайп вниз">
        <svg width="24" height="15" viewBox="0 0 26 16" fill="none" aria-hidden="true">
          <path d="M3 3 L13 12 L23 3" stroke="#16123A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p id="hangHint">вниз — сброс</p>
    </div>
  </section>

  <div id="flood" aria-hidden="true"></div>
</div>

<script>
'use strict';
(function(){

var RM = false;
try{ RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

var RUC='#2726FF', HEC='#FF4D00', MAGC='#FF00B4', INK='#16123A';

function langColor(l){ return l==='he' ? HEC : RUC; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rgba(hex,a){
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function $(s){ return document.querySelector(s); }

/* ================= data ================= */
var CONTACTS = {
  inner: [
    { id:'tsipi', name:'ציפי', heName:true, alt:'Ципи', lang:'he',
      chips:['соседка сверху','протечка — решили','ключи от почты у неё'],
      themes:[{ru:'быт',he:'בית'},{ru:'соседи',he:'שכנים'},{ru:'срочное',he:'דחוף'}],
      talk:[
        {who:'them', ru:'у вас капает?', he:'אצלכם מטפטף?'},
        {who:'you',  ru:'уже нет',       he:'כבר לא'},
        {who:'them', ru:'я поднимусь',   he:'אני אעלה'},
        {who:'you',  ru:'спасибо, Ципи', he:'תודה, ציפי'}
      ] },
    { id:'amin', name:'Амин', caps:true, alt:'אמין', lang:'he',
      chips:['коллега','смета в пятницу','говорили про садик'],
      themes:[{ru:'работа',he:'עבודה'},{ru:'смета',he:'הצעת מחיר'},{ru:'садик',he:'גן'}],
      talk:[
        {who:'you',  ru:'смета готова?', he:'ההצעה מוכנה?'},
        {who:'them', ru:'почти',         he:'כמעט'},
        {who:'them', ru:'в пятницу',     he:'ביום שישי'},
        {who:'you',  ru:'договорились',  he:'סגור'}
      ] },
    { id:'mama', name:'мама', alt:'אמא', lang:'ru',
      chips:['врач в четверг','спросить про давление','рецепт плова'],
      themes:[{ru:'здоровье'},{ru:'внуки'},{ru:'быт'}],
      talk:[
        {who:'them', ru:'ты поел?'},
        {who:'you',  ru:'мам, всё хорошо'},
        {who:'them', ru:'врач в четверг'},
        {who:'you',  ru:'я отвезу'}
      ] }
  ],
  outer: [
    { id:'igor', name:'Игорь', caps:true, alt:'איגור', lang:'ru', phone:'+7 921 604-18-32',
      chips:['сантехник','обещал перезвонить','кран на кухне'],
      themes:[{ru:'кран'},{ru:'сроки'},{ru:'оплата'}],
      talk:[
        {who:'you',  ru:'кран течёт'},
        {who:'them', ru:'завтра к девяти'},
        {who:'you',  ru:'жду'}
      ] },
    { id:'ronit', name:'רונית', heName:true, alt:'Ронит', lang:'he', phone:'+972 54-233-70-81',
      chips:['риелтор','двушка в Хайфе','торг уместен'],
      themes:[{ru:'квартира',he:'דירה'},{ru:'осмотр',he:'ביקור'},{ru:'цена',he:'מחיר'}],
      talk:[
        {who:'you',  ru:'квартира в продаже?', he:'הדירה למכירה?'},
        {who:'them', ru:'да, приходите',       he:'כן, בואו'},
        {who:'you',  ru:'а торг?',             he:'ומיקוח?'},
        {who:'them', ru:'поговорим',           he:'נדבר'}
      ] },
    { id:'meir', name:'מאיר', heName:true, alt:'Меир', lang:'he', phone:'+972 52-556-14-90',
      chips:['гараж на Алленби','колодки скрипят','берёт наличными'],
      themes:[{ru:'машина',he:'אוטו'},{ru:'запись',he:'תור'},{ru:'цена',he:'מחיר'}],
      talk:[
        {who:'you',  ru:'колодки скрипят',    he:'הרפידות חורקות'},
        {who:'them', ru:'привози во вторник', he:'תביא ביום שלישי'},
        {who:'you',  ru:'сколько выйдет?',    he:'כמה יעלה?'}
      ] }
  ]
};
/* selected theme index per contact id */
var selTheme = {};

/* ================= elements ================= */
var phone=$('#phone'), home=$('#home'), call=$('#call'), flood=$('#flood');
var wheelZone=$('#wheelZone'), wheelWrap=$('#wheelWrap');
var dotsEl=$('#dots'), deckTag=$('#deckTag'), hintEl=$('#hint');
var tglInner=$('#tglInner'), tglOuter=$('#tglOuter');
var blob=$('#blob'), trail=$('#trail');
var tint=$('#tint'), cv=$('#wave'), ctx=cv.getContext('2d');
var callInner=$('#callInner'), callName=$('#callName'), callKind=$('#callKind'), callTimer=$('#callTimer');
var dYou=$('#dYou'), dThem=$('#dThem'), flowEl=$('#flow'), callThemeEl=$('#callTheme');
var srcW=$('#srcW'), dstW=$('#dstW'), guessEl=$('#guess');
var hangBtn=$('#hang');

/* ================= wheel state ================= */
var deck='inner';
var savedIdx={inner:0, outer:0};
var cur=0, target=0;
var slides=[];       /* DOM slides of current deck */
var STEP=170;
var busy=false;      /* during flood transition */
var callOn=false;

function contacts(){ return CONTACTS[deck]; }
function curContact(){ return contacts()[clamp(Math.round(target),0,contacts().length-1)]; }

/* ================= build wheel ================= */
function sparkSvg(color){
  return '<svg viewBox="0 0 12 12" aria-hidden="true"><path fill="'+color+'" d="M6 0 L7.4 4.6 L12 6 L7.4 7.4 L6 12 L4.6 7.4 L0 6 L4.6 4.6 Z"/></svg>';
}
function badgeSvg(c){
  if(deck==='inner'){
    return '<svg class="bdg" viewBox="0 0 64 20" aria-hidden="true">'
      +'<path d="M2 10 Q10 2 18 10 T34 10" fill="none" stroke="'+RUC+'" stroke-width="3" stroke-linecap="round"/>'
      +'<path d="M30 10 Q38 18 46 10 T62 10" fill="none" stroke="'+langColor(c.lang)+'" stroke-width="3" stroke-linecap="round"/>'
      +'</svg>';
  }
  return '<svg class="bdg" viewBox="0 0 24 20" aria-hidden="true">'
    +'<circle cx="10" cy="11" r="7.5" fill="none" stroke="'+langColor(c.lang)+'" stroke-width="2.2" stroke-dasharray="3 3.6" stroke-linecap="round"/>'
    +'<path d="M13 8 L21 1.6 M21 6.4 V1.6 H16.2" fill="none" stroke="'+INK+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'
    +'</svg>';
}

function buildWheel(){
  wheelWrap.innerHTML='';
  dotsEl.innerHTML='';
  slides=[];
  var list=contacts();
  list.forEach(function(c,i){
    var s=document.createElement('div');
    s.className='slide'+(deck==='outer'?' outer':'');
    s.dataset.i=i;
    var ca=langColor(c.lang);
    s.style.setProperty('--ca',ca);
    s.style.setProperty('--cb',RUC);

    var nameCls='nm '+(c.heName?'nm-he':'nm-ru')+(c.caps?' caps':'');
    if(deck==='inner'){
      nameCls += (c.lang==='ru') ? ' fill-solid' : ' fill-duo';
    }else{
      nameCls += ' hollow';
    }
    var chipsHtml=c.chips.map(function(t){
      return '<span class="chip" style="border-color:'+rgba(ca,.5)+';background:'+rgba(ca,.06)+'">'+sparkSvg(ca)+t+'</span>';
    }).join('');
    var themesHtml=c.themes.map(function(t,ti){
      var on = selTheme[c.id]===ti ? ' on':'';
      var rot=(ti%2===0?-2:2)+'deg';
      return '<button class="th'+on+'" data-t="'+ti+'" style="--tr:'+rot+'">'+t.ru+'</button>';
    }).join('');

    s.innerHTML =
      badgeSvg(c)
      +'<div class="'+nameCls+'"'+(c.heName?' dir="rtl" lang="he"':'')+'>'+c.name+'</div>'
      +'<div class="meta">'
      +  '<span class="alt"'+(c.heName?'':' lang="he" dir="rtl"')+'>'+c.alt+'</span>'
      +  (c.phone?'<span class="phn">'+c.phone+'</span>':'')
      +  '<div class="chips">'+chipsHtml+'</div>'
      +  '<div class="themes">'+themesHtml+'</div>'
      +'</div>';

    wheelWrap.appendChild(s);
    slides.push(s);

    var d=document.createElement('button');
    d.className='dot';
    d.setAttribute('aria-label', c.alt||c.name);
    d.style.setProperty('--dotc',ca);
    d.addEventListener('click',function(){ target=i; });
    dotsEl.appendChild(d);

    /* theme taps */
    s.querySelectorAll('.th').forEach(function(b){
      b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
      b.addEventListener('click',function(e){
        e.stopPropagation();
        var ti=+b.dataset.t;
        selTheme[c.id] = (selTheme[c.id]===ti) ? null : ti;
        s.querySelectorAll('.th').forEach(function(x,xi){
          x.classList.toggle('on', selTheme[c.id]===xi);
        });
      });
    });
  });

  cur=target=clamp(savedIdx[deck],0,list.length-1);
  deckTag.textContent = deck==='inner' ? 'внутри · samevoice' : 'вовне · номера';
  hintEl.textContent  = deck==='inner' ? 'вверх — звонок · вбок — вовне' : 'вверх — звонок · вбок — внутрь';
  tglInner.setAttribute('aria-pressed', deck==='inner');
  tglOuter.setAttribute('aria-pressed', deck==='outer');
  fitAll();
  syncCurrent(true);
}

function fitAll(){
  var max=phone.clientWidth-40;
  slides.forEach(function(s){
    var nm=s.querySelector('.nm');
    nm.style.fontSize='100px';
    var w=nm.scrollWidth||1;
    var fs=100*max/w;
    var cap=nm.classList.contains('nm-he')?205:165;
    nm.style.fontSize=clamp(fs,44,cap)+'px';
  });
}

var lastRound=-1;
function syncCurrent(force){
  var r=clamp(Math.round(cur),0,contacts().length-1);
  if(r===lastRound && !force) return;
  lastRound=r;
  var c=contacts()[r];
  var ca=langColor(c.lang);
  home.style.setProperty('--ca',ca);
  home.style.setProperty('--cb',RUC);
  var dots=dotsEl.children;
  for(var i=0;i<dots.length;i++) dots[i].classList.toggle('on',i===r);
}

function renderWheel(){
  for(var i=0;i<slides.length;i++){
    var off=i-cur, a=Math.abs(off), el=slides[i];
    if(a>2.2){ el.style.visibility='hidden'; continue; }
    el.style.visibility='visible';
    el.style.transform='translate(-50%,-50%) translateY('+(off*STEP)+'px) rotateX('+(off*-30)+'deg) scale('+(1-Math.min(.3,a*.2))+')';
    el.style.opacity = a<.5 ? 1 : Math.max(.1,.5-(a-.5)*.28);
    el.style.zIndex = a<.5 ? 3 : 1;
    el.querySelector('.meta').style.opacity=Math.max(0,1-a*2.6);
  }
  syncCurrent(false);
}

/* ================= deck switch ================= */
function switchDeck(){
  if(busy||callOn) return;
  savedIdx[deck]=clamp(Math.round(target),0,contacts().length-1);
  deck = deck==='inner' ? 'outer' : 'inner';
  lastRound=-1;
  if(RM){ buildWheel(); return; }
  wheelWrap.style.transition='transform .16s ease, opacity .16s ease';
  wheelWrap.style.transform='translateX(-46px)';
  wheelWrap.style.opacity='0';
  setTimeout(function(){
    buildWheel();
    wheelWrap.style.transition='none';
    wheelWrap.style.transform='translateX(46px)';
    void wheelWrap.offsetWidth;
    wheelWrap.style.transition='transform .2s ease, opacity .2s ease';
    wheelWrap.style.transform='translateX(0)';
    wheelWrap.style.opacity='1';
  },165);
}
tglInner.addEventListener('click',function(){ if(deck!=='inner') switchDeck(); });
tglOuter.addEventListener('click',function(){ if(deck!=='outer') switchDeck(); });
deckTag.addEventListener('click',switchDeck);

/* ================= wheel gestures ================= */
var drag=null;
wheelZone.addEventListener('pointerdown',function(e){
  if(busy||callOn) return;
  if(e.target.closest('.th')) return;
  drag={x0:e.clientX,y0:e.clientY,cur0:cur,t0:performance.now(),
        axis:null,moved:false,lastY:e.clientY,lastT:performance.now(),vy:0,dx:0};
  try{ wheelZone.setPointerCapture(e.pointerId); }catch(err){}
});
wheelZone.addEventListener('pointermove',function(e){
  if(!drag) return;
  var dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!drag.axis && (Math.abs(dx)>10||Math.abs(dy)>10)){
    drag.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
    drag.moved=true;
  }
  if(drag.axis==='y'){
    var n=contacts().length;
    cur=clamp(drag.cur0-dy/STEP,-0.35,n-1+0.35);
    target=cur;
    var now=performance.now(), dt=now-drag.lastT;
    if(dt>0){ drag.vy=(e.clientY-drag.lastY)/dt; }
    drag.lastY=e.clientY; drag.lastT=now;
  }else if(drag.axis==='x'){
    drag.dx=dx;
    wheelWrap.style.transition='none';
    wheelWrap.style.transform='translateX('+(dx*0.35)+'px)';
  }
});
function wheelUp(e){
  if(!drag) return;
  var d=drag; drag=null;
  var n=contacts().length;
  if(d.axis==='y'){
    var t=cur - d.vy*90/STEP;
    target=clamp(Math.round(t),0,n-1);
  }else if(d.axis==='x'){
    wheelWrap.style.transition='transform .2s ease';
    wheelWrap.style.transform='translateX(0)';
    if(Math.abs(d.dx)>70) switchDeck();
  }else{
    /* tap */
    var dt=performance.now()-d.t0;
    if(dt<450){
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit && hit.closest ? hit.closest('.slide') : null;
      if(sl){
        var i=+sl.dataset.i;
        if(i===Math.round(target) && hit.closest('.nm')) startCall(curContact());
        else target=i;
      }
    }
    target=clamp(Math.round(target),0,n-1);
  }
}
wheelZone.addEventListener('pointerup',wheelUp);
wheelZone.addEventListener('pointercancel',function(){
  if(drag){ drag=null; target=clamp(Math.round(cur),0,contacts().length-1);
    wheelWrap.style.transition='transform .2s ease'; wheelWrap.style.transform='translateX(0)'; }
});

/* mouse wheel + keys on desktop */
var wheelLock=0;
home.addEventListener('wheel',function(e){
  if(callOn||busy) return;
  e.preventDefault();
  var now=performance.now();
  if(now-wheelLock<300) return;
  wheelLock=now;
  var n=contacts().length;
  target=clamp(Math.round(target)+(e.deltaY>0?1:-1),0,n-1);
},{passive:false});

document.addEventListener('keydown',function(e){
  if(busy) return;
  if(callOn){
    if(e.key==='Escape'||e.key==='ArrowDown') endCall();
    return;
  }
  var n=contacts().length;
  if(e.key==='ArrowDown') target=clamp(Math.round(target)+1,0,n-1);
  else if(e.key==='ArrowUp') target=clamp(Math.round(target)-1,0,n-1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight') switchDeck();
  else if(e.key==='Enter') startCall(curContact());
});

/* ================= pull-to-call blob ================= */
var pull=null;
blob.addEventListener('pointerdown',function(e){
  if(busy||callOn) return;
  e.stopPropagation();
  pull={y0:e.clientY,t0:performance.now(),fired:false};
  blob.classList.remove('spring');
  try{ blob.setPointerCapture(e.pointerId); }catch(err){}
});
blob.addEventListener('pointermove',function(e){
  if(!pull||pull.fired) return;
  var dy=e.clientY-pull.y0;
  var up=Math.max(0,-dy);
  blob.style.transform='translateY('+Math.min(0,dy*0.55)+'px) scaleY('+(1+Math.min(.4,up/300))+')';
  trail.style.height=(up*0.8)+'px';
  if(up>=125){
    pull.fired=true;
    blob.style.transform='';
    trail.style.height='0';
    startCall(curContact());
  }
});
function pullEnd(e){
  if(!pull) return;
  var p=pull; pull=null;
  if(p.fired) return;
  var dy=e.clientY-p.y0, dt=performance.now()-p.t0;
  blob.classList.add('spring');
  blob.style.transform='';
  trail.style.height='0';
  if(Math.abs(dy)<10 && dt<400) startCall(curContact());  /* click = call (desktop) */
}
blob.addEventListener('pointerup',pullEnd);
blob.addEventListener('pointercancel',function(){ if(pull){ pull=null; blob.classList.add('spring'); blob.style.transform=''; trail.style.height='0'; } });

/* ================= flood transition ================= */
function sweep(color, midCb, endCb){
  if(RM){ midCb(); if(endCb) endCb(); return; }
  flood.style.setProperty('--fa',color);
  flood.classList.remove('anim','cover','up');
  flood.style.transform='translateY(103%)';
  void flood.offsetWidth;
  flood.style.transform='';
  flood.classList.add('anim','cover');
  setTimeout(function(){
    midCb();
    flood.classList.add('up');
    flood.classList.remove('cover');
    setTimeout(function(){
      flood.classList.remove('anim','up');
      if(endCb) endCb();
    },440);
  },440);
}
function sweepDown(color, midCb, endCb){
  if(RM){ midCb(); if(endCb) endCb(); return; }
  flood.style.setProperty('--fa',color);
  flood.classList.remove('anim','cover','up');
  flood.classList.add('up');
  void flood.offsetWidth;
  flood.classList.add('anim','cover');
  flood.classList.remove('up');
  setTimeout(function(){
    midCb();
    flood.classList.remove('cover');   /* back to translateY(103%) — drains down */
    setTimeout(function(){
      flood.classList.remove('anim');
      if(endCb) endCb();
    },440);
  },440);
}

/* ================= words (letters engine) ================= */
function setWord(el, text, he, color, fsCap){
  el.className='wword '+(he?'w-he':'w-ru');
  el.dir=he?'rtl':'ltr';
  if(he) el.setAttribute('lang','he'); else el.removeAttribute('lang');
  el.style.setProperty('--wc',color);
  var len=Math.max(4,text.length);
  var fs=clamp(560/len, 26, fsCap||(he?60:46));
  el.style.fontSize=fs+'px';
  el.innerHTML='';
  var chars=Array.from(text);
  for(var i=0;i<chars.length;i++){
    var sp=document.createElement('span');
    sp.className='lt';
    sp.textContent = chars[i]===' ' ? ' ' : chars[i];
    sp.style.setProperty('--i',i);
    el.appendChild(sp);
  }
}
function scrambleProps(el, upBias){
  el.querySelectorAll('.lt').forEach(function(sp){
    sp.style.setProperty('--dx',(Math.random()*90-45).toFixed(0)+'px');
    sp.style.setProperty('--dy',(upBias?(-40-Math.random()*110):(30+Math.random()*60)).toFixed(0)+'px');
    sp.style.setProperty('--rr',(Math.random()*50-25).toFixed(0)+'deg');
  });
}
function assemble(el){
  scrambleProps(el,false);
  el.classList.remove('fade','gone');
  el.classList.add('enter');
  void el.offsetWidth;
  requestAnimationFrame(function(){ el.classList.remove('enter'); });
}
function scatter(el){
  scrambleProps(el,true);
  el.classList.add('gone');
}

/* ================= call ================= */
var callC=null, convo=[], convoI=0, convoTimers=[], timerInt=null, t0call=0;
var speaking='none';   /* 'you' | 'them' | 'none' */
var env=0, mouth=0.12;
var pulses=[];

function buildConvo(c){
  var arr=c.talk.slice();
  var ti=selTheme[c.id];
  if(ti!=null && c.themes[ti]){
    var t=c.themes[ti];
    arr.unshift({who:'you', ru:t.ru, he:t.he});
  }
  return arr;
}

function startCall(c){
  if(busy||callOn||!c) return;
  busy=true;
  callC=c; convo=buildConvo(c); convoI=0;
  var ca=langColor(c.lang);
  call.style.setProperty('--ca',ca);

  /* head */
  var dispName=c.caps?c.name.toUpperCase():c.name;
  setWord(callName,dispName,!!c.heName,ca,c.heName?66:44);
  callName.classList.add(c.heName?'nm-he':'nm-ru');
  callKind.textContent = c.phone ? c.phone : 'samevoice';
  dThem.textContent=(c.alt||c.name)+' · '+(c.lang==='he'?'עב':'ру');
  dThem.style.setProperty('--c',ca);
  dYou.style.setProperty('--c',RUC);
  var ti=selTheme[c.id];
  if(ti!=null && c.themes[ti]){
    callThemeEl.textContent=c.themes[ti].ru;
    callThemeEl.classList.remove('none');
  }else{
    callThemeEl.classList.add('none');
  }
  srcW.innerHTML=''; dstW.innerHTML='';
  srcW.className='wword'; dstW.className='wword';
  guessEl.classList.remove('show');
  callInner.style.transition='none';
  callInner.style.transform='';

  sweep(ca, function(){
    home.classList.remove('on');
    call.classList.add('on');
    callOn=true; speaking='none'; env=0; mouth=0.12; pulses=[];
    sizeCanvas();
    if(RM) drawWave(2.2);
    assemble(callName);
    t0call=performance.now();
    callTimer.textContent='00:00';
    timerInt=setInterval(function(){
      var s=Math.floor((performance.now()-t0call)/1000);
      callTimer.textContent=(s<600?'0':'')+Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
    },1000);
    convoTimers.push(setTimeout(runStep,900));
  }, function(){ busy=false; });
}

function runStep(){
  if(!callOn) return;
  var e=convo[convoI%convo.length];
  convoI++;
  speakEntry(e);
  convoTimers.push(setTimeout(runStep,3400));
}

function speakEntry(e){
  var who=e.who;
  speaking=who;
  updateStrip();
  setTintBg();

  var isHe = callC.lang==='he';
  var srcTxt = who==='you' ? e.ru : (isHe ? e.he : e.ru);
  var srcHe  = who==='you' ? false : isHe;
  var dstTxt = isHe ? (who==='you' ? e.he : e.ru) : null;
  var dstHe  = who==='you' ? isHe : false;
  var srcColor = who==='you' ? RUC : langColor(callC.lang);
  var dstColor = who==='you' ? langColor(callC.lang) : RUC;

  dstW.classList.add('fade');
  setWord(srcW,srcTxt,srcHe,srcColor);
  srcW.classList.add('ghost');
  guessEl.classList.add('show');
  assemble(srcW);
  mouth=0.3;

  convoTimers.push(setTimeout(function(){
    srcW.classList.remove('ghost');
    guessEl.classList.remove('show');
    mouth=1;
  },480));

  convoTimers.push(setTimeout(function(){
    mouth=0.15;
    if(dstTxt){
      scatter(srcW);
      pulses.push({t0:performance.now(), dir: who==='you'?1:-1, color:dstColor});
      setWord(dstW,dstTxt,dstHe,dstColor);
      assemble(dstW);
      if(RM) drawWave(3.1);
    }else{
      srcW.classList.add('fade');
    }
  },1600));

  convoTimers.push(setTimeout(function(){
    dstW.classList.add('fade');
  },3050));
}

function updateStrip(){
  dYou.classList.toggle('live',speaking==='you');
  dThem.classList.toggle('live',speaking==='them');
  var fc = speaking==='them' ? langColor(callC.lang) : RUC;
  flowEl.style.setProperty('--fc',fc);
  flowEl.classList.toggle('f-you',speaking!=='them');
  flowEl.classList.toggle('f-them',speaking==='them');
}
function setTintBg(){
  var c = speaking==='them' ? langColor(callC.lang) : RUC;
  var at = speaking==='them' ? '14%' : '86%';
  var lis = speaking==='them' ? RUC : langColor(callC.lang);
  tint.style.background=
    'radial-gradient(130% 75% at 50% '+at+','+rgba(c,.22)+', transparent 62%),'
   +'linear-gradient('+(speaking==='them'?'180deg':'0deg')+', transparent 55%, '+rgba(lis,.10)+')';
}

function endCall(){
  if(!callOn||busy) return;
  busy=true;
  callOn=false;
  convoTimers.forEach(clearTimeout); convoTimers=[];
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  var ca=callC?langColor(callC.lang):RUC;
  sweepDown(ca, function(){
    call.classList.remove('on');
    home.classList.add('on');
    callInner.style.transform='';
    tint.style.opacity='0';
    srcW.innerHTML=''; dstW.innerHTML='';
  }, function(){ busy=false; });
}
hangBtn.addEventListener('click',function(e){ e.stopPropagation(); endCall(); });
hangBtn.addEventListener('pointerdown',function(e){ e.stopPropagation(); });

/* hang by swipe down */
var hdrag=null;
call.addEventListener('pointerdown',function(e){
  if(!callOn||busy) return;
  hdrag={y0:e.clientY};
  callInner.style.transition='none';
  try{ call.setPointerCapture(e.pointerId); }catch(err){}
});
call.addEventListener('pointermove',function(e){
  if(!hdrag) return;
  var dy=Math.max(0,e.clientY-hdrag.y0);
  hdrag.dy=dy;
  callInner.style.transform='translateY('+(dy*0.32)+'px)';
  hangBtn.style.transform='translateX(-50%) scale('+(1+Math.min(.5,dy/300))+')';
});
function hangUp(){
  if(!hdrag) return;
  var d=hdrag; hdrag=null;
  hangBtn.style.transform='translateX(-50%)';
  if((d.dy||0)>150){ endCall(); return; }
  callInner.style.transition='transform .25s ease';
  callInner.style.transform='';
}
call.addEventListener('pointerup',hangUp);
call.addEventListener('pointercancel',hangUp);

/* ================= canvas wave ================= */
var dpr=1;
function sizeCanvas(){
  dpr=window.devicePixelRatio||1;
  cv.width=Math.round(cv.clientWidth*dpr);
  cv.height=Math.round(cv.clientHeight*dpr);
}
window.addEventListener('resize',function(){
  sizeCanvas(); fitAll();
  if(callOn&&RM) drawWave(2.2);
});

var LAYERS=[
  {a:1,   f1:.017, f2:.031, sp:1.6, ph:0,   lw:2.6, al:.95},
  {a:.55, f1:.023, f2:.041, sp:2.2, ph:2.1, lw:1.8, al:.55},
  {a:1.1, f1:.013, f2:.027, sp:1.1, ph:4.0, lw:9,   al:.10}
];

function drawWave(t){
  var W=cv.clientWidth, H=cv.clientHeight;
  if(!W||!H) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var mid=H*0.47, A0=56;
  var themC=callC?langColor(callC.lang):HEC;
  var midC = (callC&&callC.lang==='ru') ? '#7A7AFF' : MAGC;
  var grad=ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,RUC);
  grad.addColorStop(.5,midC);
  grad.addColorStop(1,themC);
  ctx.lineCap='round';
  ctx.strokeStyle=grad;

  for(var L=0;L<LAYERS.length;L++){
    var ly=LAYERS[L];
    ctx.globalAlpha=ly.al;
    ctx.lineWidth=ly.lw;
    ctx.beginPath();
    for(var x=0;x<=W;x+=5){
      var p=x/W;
      var edge=Math.pow(Math.sin(Math.PI*p),0.8);
      var bias = speaking==='you' ? (1.25-0.55*p)
               : speaking==='them' ? (0.7+0.55*p) : 1;
      var y=mid + env*A0*ly.a*edge*bias*(
          Math.sin(x*ly.f1 + t*ly.sp + ly.ph)*0.62
        + Math.sin(x*ly.f2 - t*ly.sp*1.7)*0.33
        + Math.sin(x*0.006 + t*0.6)*0.3 );
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  /* translation pulses running along the wave */
  var now=performance.now();
  for(var i=pulses.length-1;i>=0;i--){
    var pu=pulses[i];
    var pp=(now-pu.t0)/650;
    if(pp>1){ pulses.splice(i,1); continue; }
    var xp = pu.dir>0 ? pp : 1-pp;
    var px=xp*W;
    var g=ctx.createRadialGradient(px,mid,0,px,mid,26);
    g.addColorStop(0,'rgba(255,255,255,.95)');
    g.addColorStop(.4,rgba(pu.color,.75));
    g.addColorStop(1,rgba(pu.color,0));
    ctx.globalAlpha=1-pp*0.6;
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(px,mid,26,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ================= main loop ================= */
function loop(ts){
  if(!drag){
    cur += (target-cur)*(RM?1:0.16);
    if(Math.abs(target-cur)<0.002) cur=target;
  }
  renderWheel();
  if(callOn && !RM){
    var t=ts/1000;
    var noise=0.62+0.38*Math.sin(t*9.1)+0.18*Math.sin(t*23.7);
    env += (mouth*Math.abs(noise)+0.05-env)*0.09;
    env=clamp(env,0,1.2);
    drawWave(t);
    tint.style.opacity=(0.45+env*0.55).toFixed(2);
  }
  requestAnimationFrame(loop);
}

/* ================= init ================= */
buildWheel();
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(fitAll).catch(function(){});
}
requestAnimationFrame(loop);

})();
</script>
</body>
