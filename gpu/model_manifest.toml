schema_version = 1
updated = "2026-08-30"

# This manifest is the benchmark selection, not a production promise. Model
# weights live under /workspace and are never committed to Git.

[[models]]
id = "nvidia/nemotron-3.5-asr-streaming-0.6b"
role = "acoustic_stt_ru"
gpu = 0
license = "OpenMDW-1.1"
languages = ["ru-RU"]
status = "stage1_runtime"
notes = "Native cache-aware streaming ASR used for Russian Stage 1. Default Transformers lookahead=3 gives a nominal 320 ms streaming chunk; benchmark 0/3/6/13 on real Israeli calls rather than assuming the lowest lookahead wins."

[[models]]
id = "ivrit-ai/whisper-large-v3-turbo-ct2"
role = "acoustic_stt_he"
gpu = 0
license = "Apache-2.0"
languages = ["he"]
status = "stage1_runtime_fallback"
notes = "Hebrew-specific Faster-Whisper CT2 checkpoint (~1.62 GB). Force language=he. Stage 1 exposes rolling snapshots plus a final transcript; this is not native RNNT streaming."

[[models]]
id = "nvidia/nemotron-3.5-asr-streaming-0.6b"
role = "acoustic_stt_he_future"
gpu = 0
license = "OpenMDW-1.1"
languages = ["he-IL"]
status = "finetune_required"
notes = "Hebrew is recognized by the tokenizer but NVIDIA classifies it as adaptation-ready, not transcription-ready. Do not route Hebrew production audio through stock weights."

[[models]]
id = "Qwen/Qwen3-0.6B-Base"
role = "next_word_predictor"
gpu = 0
license = "Apache-2.0"
languages = ["ru", "he"]
status = "benchmark"
notes = "Small causal LM used only to predict Top-K candidates for the next SOURCE word. Qwen3-1.7B-Base is a later accuracy/latency A/B candidate."

[[models]]
id = "Helsinki-NLP/opus-mt-ru-he"
role = "local_mt"
gpu = 0
license = "Apache-2.0"
languages = ["ru->he"]
status = "benchmark"
notes = "Small pair-specific Marian baseline. Greedy decoding only for the first latency baseline."

[[models]]
id = "Helsinki-NLP/opus-mt-he-ru"
role = "local_mt"
gpu = 0
license = "Apache-2.0"
languages = ["he->ru"]
status = "benchmark"
notes = "Small pair-specific Marian baseline. Greedy decoding only for the first latency baseline."

[[models]]
id = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
role = "local_tts_ru"
gpu = 1
license = "Apache-2.0"
languages = ["ru"]
status = "benchmark_later"
notes = "Streaming/voice-clone candidate for supported languages. Hebrew is not in the official 10-language set, so this model must never be selected for HE."

[[models]]
id = "ResembleAI/chatterbox"
role = "local_tts_he_ab"
gpu = 1
license = "MIT"
languages = ["he", "ru"]
status = "benchmark_later"
notes = "Open-source multilingual voice-cloning A/B candidate for Hebrew/Russian. Generated audio is watermarked; benchmark TTFA before considering it for the realtime path."

[[models]]
id = "cartesia/sonic-3.5"
role = "premium_tts_external"
gpu = -1
license = "vendor-service"
languages = ["he", "ru"]
status = "current_quality_path"
notes = "External streaming quality path. Keep as the control while local TTS is benchmarked; no vendor model weights are stored locally."
